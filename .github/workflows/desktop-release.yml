# Desktop release: build, sign, notarize, and publish the macOS application.
#
# Triggered by a `desktop-v*` tag or by hand. The tag prefix is deliberately not
# `dsh-v*`: that prefix belongs to the upstream npm release train, whose tags
# arrive with every upstream fetch and would eventually collide with one here.
#
# The `desktop-release` environment holds the signing and notarization secrets
# and requires a reviewer, so a release cannot publish without a human decision
# even when the workflow is dispatched by accident.
name: Desktop release

on:
  push:
    tags:
      - 'desktop-v*'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the artifacts to a GitHub release. Unchecked builds and uploads only.
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  PRIMARY_NODE_VERSION: '24'
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  package:
    name: package (arm64)
    runs-on: macos-latest
    timeout-minutes: 90
    environment: desktop-release
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      # The closure carries built library and frontend output, so the workspace
      # is built before it is deployed rather than after.
      - name: Build the workspace
        run: pnpm run build

      - name: Materialize the runtime closure
        run: node desktop/build/build-closure.mjs

      # `pnpm deploy` perturbs the workspace install state; the packaging script
      # restores it, but the shell build needs it restored before that step runs.
      - name: Restore the workspace install
        run: pnpm install --frozen-lockfile

      - name: Prepare signing credentials
        env:
          CSC_LINK_BASE64: ${{ secrets.CSC_LINK }}
        run: |
          set -euo pipefail
          printf '%s' "$CSC_LINK_BASE64" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          printf 'CSC_LINK=%s\n' "$RUNNER_TEMP/developer-id.p12" >> "$GITHUB_ENV"

      - name: Package, sign, and notarize
        env:
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ runner.temp }}/AuthKey.p8
          DSH_DESKTOP_NOTARIZE: '1'
        run: |
          set -euo pipefail
          printf '%s' "${{ secrets.APPLE_API_KEY }}" > "$RUNNER_TEMP/AuthKey.p8"
          node desktop/build/package-app.mjs --skip-closure --arch arm64

      # The gate that makes the pipeline meaningful: the artifact is checked on
      # the machine that produced it, and the alternative is discovering a
      # signature problem on a user's machine.
      - name: Verify the built application
        run: |
          set -euo pipefail
          app="desktop/apps/shell/dist/mac-arm64/DeepSeek Harness.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose=4 "$app"
          xcrun stapler validate "$app"

      - name: Publish to the release
        if: startsWith(github.ref, 'refs/tags/') || inputs.publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          pnpm --filter @deepseek-ai/dsh-desktop-shell exec electron-builder \
            --mac --arm64 --publish always

      - uses: actions/upload-artifact@v7
        with:
          name: desktop-macos-arm64
          path: |
            desktop/apps/shell/dist/*.dmg
            desktop/apps/shell/dist/*.zip
            desktop/apps/shell/dist/latest-mac.yml
          if-no-files-found: error
          retention-days: 14
