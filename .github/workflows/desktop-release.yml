# Desktop release: build, sign, notarize, and publish the Desktop application.
#
# A `v<version>` tag starts a release. The tag is the released version itself because the
# updater's GitHub provider reads release tags as semantic versions and matches a prerelease
# channel by the version's own prerelease component. A manual run builds without publishing
# unless the `publish` input is set.
#
# Secrets and variables the `desktop-release` environment must hold (it also requires a
# reviewer, so a release cannot publish without a human decision):
#   secrets.CSC_LINK, secrets.CSC_KEY_PASSWORD
#       Developer ID Application certificate as base64 PKCS#12 and its password.
#   secrets.DSH_DESKTOP_MACOS_SIGNING_IDENTITY, secrets.DSH_DESKTOP_MACOS_TEAM_ID
#       Signing common name (with or without the `Developer ID Application: ` prefix) and the
#       ten-character team identifier.
#   secrets.APPLE_API_KEY, secrets.APPLE_API_KEY_ID, secrets.APPLE_API_ISSUER
#       App Store Connect key used to notarize the application and the disk image.
#   vars.DSH_DESKTOP_APP_ID
#       Bundle identifier, for example com.xuyutech.dsh.desktop.
#
# The upload step needs no extra credential: the workflow's own token has `contents: write` on
# this repository, which is the release destination `desktop-auto-update-environment.mjs` names.
#
# Windows signing needs a SafeNet token attached to a self-hosted runner, so the Windows lane
# builds an unsigned installer and keeps it out of the release.
name: Desktop release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the artifacts to the GitHub release. Unchecked builds and uploads only.
        type: boolean
        required: false
        default: false
      windows:
        description: Also build the unsigned Windows installer.
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  PRIMARY_NODE_VERSION: '24'
  DSH_TELEMETRY_DISABLED: '1'
  DSH_DESKTOP_AUTO_UPDATE_ENV: production

jobs:
  tag:
    name: release tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      # The updater resolves `<channel>-mac.yml` inside the released tag, so a tag that does not
      # name the packaged version publishes a release no application can update from.
      - name: Check the tag names the released version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "release tag $GITHUB_REF_NAME does not name version $version" >&2
            exit 1
          fi

  macos:
    name: package (${{ matrix.target }})
    needs: tag
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    environment: desktop-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: mac-arm64
            runner: macos-latest
            upload: upload:mac:arm64
          # The x64 build runs its own x64 toolchain under Rosetta on the same Apple Silicon
          # image, because the Intel macOS runner labels are being retired.
          - target: mac-x64
            runner: macos-latest
            upload: upload:mac:x64
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      # `security import` is the only way a release certificate reaches the signing identity
      # that `electron-builder.config.mjs` names; the certificate never persists past the job.
      - name: Import the release certificate
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/release.keychain-db"
          password=$(openssl rand -hex 16)
          printf '%s' "$CSC_LINK" | base64 --decode > "$RUNNER_TEMP/release.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/release.p12" -k "$keychain" -P "$CSC_KEY_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/release.p12"
          echo "DSH_DESKTOP_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Package, sign, and notarize
        env:
          DSH_DESKTOP_APP_ID: ${{ vars.DSH_DESKTOP_APP_ID }}
          DSH_DESKTOP_MACOS_SIGNING_IDENTITY: ${{ secrets.DSH_DESKTOP_MACOS_SIGNING_IDENTITY }}
          DSH_DESKTOP_MACOS_TEAM_ID: ${{ secrets.DSH_DESKTOP_MACOS_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          printf '%s' "${{ secrets.APPLE_API_KEY }}" > "$RUNNER_TEMP/AuthKey.p8"
          export APPLE_API_KEY="$RUNNER_TEMP/AuthKey.p8"
          pnpm --filter @deepseek-ai/dsh-desktop run package:${{ matrix.target }}

      # The artifact is qualified on the machine that produced it: signature, Gatekeeper, and the
      # notarization ticket are all checked before the DMG can be published.
      - name: Verify the packaged application
        run: |
          set -euo pipefail
          artifacts="apps/desktop/.desktop-build/targets/${{ matrix.target }}/artifacts"
          app=$(find "$artifacts" -maxdepth 2 -name 'DeepSeek Harness.app' -print -quit)
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose=4 "$app"
          for dmg in "$artifacts"/*.dmg; do
            spctl --assess --type open --context context:primary-signature --verbose=4 "$dmg"
            xcrun stapler validate "$dmg"
          done

      - name: Publish to the release
        if: startsWith(github.ref, 'refs/tags/') || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: pnpm --filter @deepseek-ai/dsh-desktop run ${{ matrix.upload }}

      - name: Remove the release certificate
        if: always()
        run: security delete-keychain "$DSH_DESKTOP_KEYCHAIN" 2> /dev/null || true

      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.target }}
          path: |
            apps/desktop/.desktop-build/targets/${{ matrix.target }}/artifacts/*.dmg
            apps/desktop/.desktop-build/targets/${{ matrix.target }}/artifacts/*.zip
            apps/desktop/.desktop-build/targets/${{ matrix.target }}/artifacts/*.blockmap
            apps/desktop/.desktop-build/targets/${{ matrix.target }}/artifacts/*-mac.yml
          if-no-files-found: error
          retention-days: 14

  windows:
    name: package (win-x64, unsigned)
    needs: tag
    if: github.event_name == 'workflow_dispatch' && inputs.windows
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Package (unsigned)
        run: pnpm --filter @deepseek-ai/dsh-desktop run package:win:x64:unsigned

      - uses: actions/upload-artifact@v7
        with:
          name: desktop-win-x64-unsigned
          path: |
            apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/*.exe
            apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/*.yml
          if-no-files-found: error
          retention-days: 14
