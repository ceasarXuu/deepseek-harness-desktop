<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'none'; img-src 'self' data:">
    <title id="page-title"></title>
    <link rel="stylesheet" href="plugin-manager.css">
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1 id="title"></h1>
          <p id="description"></p>
        </div>
        <button id="refresh" class="quiet" type="button"></button>
      </header>
      <section id="recovery" hidden>
        <p id="recovery-description"></p>
        <p id="startup-error" role="alert"></p>
        <button id="retry" type="button"></button>
        <button id="disable-all" type="button"></button>
      </section>
      <form id="install-form">
        <label id="package-label" for="package-spec"></label>
        <div class="install-row">
          <input id="package-spec" name="package-spec" autocomplete="off" placeholder="@scope/plugin@1.2.3" required>
          <button id="install" type="submit"></button>
        </div>
      </form>
      <p id="status" role="status" aria-live="polite"></p>
      <section aria-labelledby="installed-heading">
        <h2 id="installed-heading"></h2>
        <ul id="plugins"></ul>
        <p id="empty"></p>
      </section>
      <section aria-labelledby="bundles-heading">
        <h2 id="bundles-heading"></h2>
        <p id="bundles-description"></p>
        <p id="bundle-notice" class="notice"></p>
        <form id="bundle-file-form">
          <label id="bundle-file-label" for="bundle-file"></label>
          <div class="install-row">
            <input id="bundle-file" name="bundle-file" autocomplete="off" readonly>
            <button id="bundle-choose" class="quiet" type="button"></button>
            <button id="bundle-install-file" type="submit"></button>
          </div>
        </form>
        <form id="bundle-url-form">
          <label id="bundle-url-label" for="bundle-url"></label>
          <div class="install-row">
            <input id="bundle-url" name="bundle-url" autocomplete="off" required>
            <button id="bundle-install-url" type="submit"></button>
          </div>
        </form>
        <section aria-labelledby="bundles-installed-heading">
          <h3 id="bundles-installed-heading"></h3>
          <ul id="bundles"></ul>
          <p id="bundles-empty"></p>
        </section>
      </section>
      <section aria-labelledby="diagnostics-heading">
        <h2 id="diagnostics-heading"></h2>
        <p id="diagnostics-description"></p>
        <ul id="diagnostics"></ul>
        <div class="install-row">
          <button id="diagnostics-copy" class="quiet" type="button"></button>
          <button id="diagnostics-reveal" class="quiet" type="button"></button>
        </div>
      </section>
    </main>
    <script src="plugin-manager.js"></script>
  </body>
</html>
