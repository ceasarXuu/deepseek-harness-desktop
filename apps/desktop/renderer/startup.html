<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'none'; img-src 'self' data:">
    <title id="page-title"></title>
    <link rel="stylesheet" href="startup.css">
  </head>
  <body>
    <main aria-busy="true">
      <div id="spinner" aria-hidden="true"></div>
      <h1 id="title" role="status" aria-live="polite"></h1>
      <p id="description"></p>
      <div id="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" hidden>
        <div id="progress-bar"></div>
      </div>
      <p id="disable-advice" hidden></p>
      <p id="reset-advice" hidden></p>
      <p id="reinstall-advice" hidden></p>
      <p id="recovery-status" role="status" aria-live="polite" hidden></p>
      <pre id="error" role="alert" hidden></pre>
      <div id="actions" hidden>
        <button id="restart" type="button"></button>
        <button id="disable-plugins" class="danger" type="button"></button>
        <button id="reset-configuration" class="danger" type="button"></button>
      </div>
    </main>
    <script src="startup.js"></script>
  </body>
</html>
