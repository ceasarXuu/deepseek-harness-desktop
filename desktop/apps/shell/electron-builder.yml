# electron-builder configuration for the desktop application.
#
# The harness closure ships as an extra resource rather than inside `app.asar`:
# it is executed as a real package tree by a real Node process, and archive
# semantics would put every one of its resolution steps — ESM import of a bare
# specifier, `createRequire(...).resolve()`, `readFile` of a client bundle,
# `fileURLToPath` of a worker entry, spawning a native addon helper — behind a
# virtual filesystem. See desktop/docs/releases/v0.0.1/packaging.md.
appId: com.xuyutech.dsh.desktop
productName: DeepSeek Harness
copyright: Copyright © 2026 Xu Zhang

directories:
  output: dist

# The update feed. This is compiled into the application as `app-update.yml`, so
# the repository named here is the one an installed copy asks for its next
# version — the release origin recorded in distribution.md, not a per-build flag.
publish:
  provider: github
  owner: ceasarXuu
  repo: deepseek-harness-desktop

files:
  - lib/**/*
  - package.json

extraResources:
  # The closure is one archive plus the files that cannot be read from inside it.
  # Staging it as loose files instead means tens of thousands of small files,
  # which Finder enumerates in full before it copies any of them.
  #
  # `harness.asar` is named as a file rather than a directory for a second
  # reason: app-builder-lib's filter refuses any directory literally named
  # `node_modules` at the root of a `from` source, and a closure is almost
  # entirely node_modules.
  - from: ../../build/out/harness.asar
    to: harness.asar
    filter:
      - '**/*'
  # The same rule applies one level down: naming `harness.asar.unpacked` as the
  # source root puts its first child at `node_modules`, which the filter refuses.
  # Naming that child as the root keeps the relative path clear of the rule.
  - from: ../../build/out/harness.asar.unpacked/node_modules
    to: harness.asar.unpacked/node_modules
    filter:
      - '**/*'

mac:
  category: public.app-category.developer-tools
  icon: ../../build/icons/icon.icns
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: ../../build/entitlements.mac.plist
  entitlementsInherit: ../../build/entitlements.mac.plist
  # The application is not sandboxed: the agent executes shell commands in the
  # user's workspace and spawns language processes, which a sandboxed
  # application cannot do. Distribution is therefore a notarized DMG rather than
  # the Mac App Store, which requires the sandbox entitlement.
  notarize: true

dmg:
  title: DeepSeek Harness ${version}
  contents:
    - x: 140
      y: 200
      type: file
    - x: 400
      y: 200
      type: link
      path: /Applications
