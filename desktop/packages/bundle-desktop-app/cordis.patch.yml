# The desktop distribution's patch layer, applied by the packaged entry over
# dsh-base and then dsh-web-app. It restates only the decisions the browser
# deployment makes differently, so the browser roster, the transport, and the
# agent-preset plane all arrive from dsh-web-app unchanged.
#
# A patch replaces the targeted row's whole `config`, so each row below
# restates every key it owns.

# Loopback with an OS-assigned port. The desktop application runs one harness
# per window, so a fixed port would turn a second instance into a bind failure
# and a predictable port into something another local process can probe.
- id: webserver
  config:
    host: '127.0.0.1'
    port: 0

# The browser URL line is a readiness signal for a human at a terminal. The
# desktop shell supervises its child programmatically, so the URL is replaced by
# the structured readiness record the desktop-runtime row emits. The
# model-visible web-surface prompt is off for the same reason: it orients an
# agent working on the served application, which is not this deployment.
- id: web-runtime
  config:
    printUrl: false
    surfaceContext: false
    trustedHosts: !!js ctx.webStartup.trustedHosts

# The client-plugin reload chain watches for rebuilt bundles on disk. A
# packaged closure is immutable, so the watcher has nothing to observe.
- id: client-hmr
  disabled: true

- insert:
    # The desktop runtime glue: reports the bound port on stdout once the tree
    # has settled, which is how the shell learns where to point its window.
    - id: desktop-runtime
      name: '@deepseek-ai/dsh-desktop-app'
